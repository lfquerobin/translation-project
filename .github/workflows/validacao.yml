name: Validação

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validacao:
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.sistema }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip install ".[validacao]"
      - run: python -B tools/validar_repositorio.py
      - run: python -B tools/validar_repositorio.py --instalacao
      - run: git show --format= --check HEAD
